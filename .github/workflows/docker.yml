name: Build & push Docker image

# Publishes kamsqe/gitwhy on Docker Hub. Triggers:
#   - Push to web-ui (the active dev branch right now) → tag = web-ui
#   - Push to main → tag = latest
#   - Tag push matching v* → tags = vX.Y.Z, X.Y, X, latest
#   - Manual dispatch from the Actions UI for ad-hoc rebuilds
#
# Multi-arch: amd64 + arm64 (covers Intel/AMD laptops, Apple Silicon,
# Linux servers in both flavors, and AWS Graviton).
#
# Prereqs (one-time setup on the user's side):
#   1. Create a Docker Hub repository at hub.docker.com/r/kamsqe/gitwhy
#   2. Generate a Docker Hub access token: hub.docker.com → Account →
#      Security → New Access Token
#   3. Add it as a GitHub secret named DOCKERHUB_TOKEN (and
#      DOCKERHUB_USERNAME = kamsqe). Repo Settings → Secrets and
#      variables → Actions → New repository secret.

on:
  push:
    branches: [main, web-ui]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Don't fail loudly if the workflow runs in a fork without the
    # DOCKERHUB_TOKEN secret — there's nothing actionable. Skip the job
    # in that case. (Direct pushes from this repo will always have it.)
    if: ${{ vars.DOCKERHUB_USERNAME != '' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'kamsqe' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME || 'kamsqe' }}/gitwhy
          tags: |
            # tag pushes → semver tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # branch pushes → branch name
            type=ref,event=branch
            # main → latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Speeds up subsequent builds by caching layers in the GH Actions
          # layer cache. First run is full-build; rebuilds reuse the
          # node_modules + tsc layers when only README changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
