name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main, web-ui]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SITE_URL: https://gitwhy.pages.dev
          BASE_PATH: /
        run: pnpm --filter gitwhy-web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # On main: production deploy at gitwhy.pages.dev.
          # On web-ui: preview deploy at web-ui.gitwhy.pages.dev (Cloudflare branch alias).
          command: pages deploy web/dist --project-name=gitwhy --branch=${{ github.ref_name }}
